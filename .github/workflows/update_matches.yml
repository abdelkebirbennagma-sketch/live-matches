name: Auto Update Matches

on:
  schedule:
    - cron: '0 * * * *' # كيتحدث كل ساعة أوتوماتيكياً
  workflow_dispatch: # زر للتشغيل اليدوي وقتاش ما بغيتي

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live matches automatically" && git push)
