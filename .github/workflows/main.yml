name: Auto Update Matches

on:
  schedule:
    - cron: '0 */6 * * *' # يتم تحديث الموقع تلقائياً كل 6 ساعات
  workflow_dispatch: # زر للتشغيل اليدوي متى شئت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run automated update script
        run: |
          echo "Updating matches data automatically..."
          # هنا سيتم إضافة أمرين لتوليد جدول المباريات الجديد
          date > last_update.txt

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automatic match schedule update [skip ci]"
          branch: main
