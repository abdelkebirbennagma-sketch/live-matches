<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر للمباريات - Live Matches</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; text-align: center; }
        header { background: #1f1f1f; padding: 20px; border-bottom: 2px solid #e50914; }
        h1 { margin: 0; font-size: 24px; color: #e50914; }
        .container { max-width: 800px; margin: 30px auto; padding: 15px; }
        .match-card { background: #1e1e1e; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; }
        .match-info { font-size: 18px; font-weight: bold; }
        .watch-btn { background: #e50914; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .watch-btn:hover { background: #b20710; }
        footer { margin-top: 50px; padding: 20px; color: #777; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>موقع بث المباريات المباشرة</h1>
        <p>تابع أهم مباريات اليوم بث مباشر بجودات متعددة</p>
    </header>

    <div class="container" id="matches-list">
        <div class="match-card">
            <div class="match-info">جاري تحميل مباريات اليوم...</div>
        </div>
    </div>

    <div id="ads-container" style="margin: 20px auto;">
        <!-- أكواد إعلاناتك ستوضع هنا مستقبلاً -->
    </div>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة للموقع</p>
    </footer>

</body>
</html>
