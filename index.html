<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveSnap - Universal Video Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .downloader-box {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            border: 1px solid #334155;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="url"] {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input[type="url"]:focus {
            border-color: #38bdf8;
        }
        button {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .platforms {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            color: #64748b;
            font-size: 14px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            border-top: 1px solid #1e293b;
            font-size: 14px;
        }
        #result-area {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">SaveSnap 🚀</a>
    </header>

    <main>
        <h1>Download Videos Online</h1>
        <p class="subtitle">Download videos from TikTok, Instagram, YouTube, and Facebook instantly for free.</p>
        
        <div class="downloader-box">
            <div class="input-group">
                <input type="url" id="video-url" placeholder="Paste video link here..." required>
                <button onclick="handleDownload()">Download</button>
            </div>
            
            <div id="result-area">
                <!-- سيتم عرض أزرار التحميل هنا لاحقاً -->
            </div>

            <div class="platforms">
                <span>⚡ TikTok</span>
                <span>⚡ Instagram</span>
                <span>⚡ YouTube</span>
                <span>⚡ Facebook</span>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SaveSnap. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
