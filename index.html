<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveSnap - Online Video Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .downloader-box {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        .input-group {
            display: flex;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #475569;
        }
        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 12px 15px;
            font-size: 1rem;
        }
        .input-group button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .input-group button:hover {
            background: #1d4ed8;
        }
        .platforms {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #64748b;
            font-size: 1.2rem;
        }
        #result-area {
            margin-top: 25px;
            display: none;
            text-align: left;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SaveSnap 🚀</h1>
            <p>Download videos from TikTok, Instagram, YouTube, and Facebook instantly for free.</p>
        </header>

        <div class="downloader-box">
            <div class="input-group">
                <input type="text" id="video-url" placeholder="Paste video link here...">
                <button onclick="handleDownload()">Download</button>
            </div>

            <div class="platforms">
                <span><i class="fa-brands fa-tiktok"></i> TikTok</span>
                <span><i class="fa-brands fa-instagram"></i> Instagram</span>
                <span><i class="fa-brands fa-youtube"></i> YouTube</span>
                <span><i class="fa-brands fa-facebook"></i> Facebook</span>
            </div>

            <div id="result-area"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SaveSnap. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
